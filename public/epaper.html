<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ई-पेपर | VartaPrimeNews</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      margin: 0;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
    }

    .epaper-toolbar {
      background: #fff;
      border-bottom: 1px solid #ccc;
      padding: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .epaper-toolbar-inner {
      max-width: 1180px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .epaper-toolbar select,
    .epaper-toolbar input,
    .epaper-toolbar button {
      padding: 9px 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
    }

    .epaper-toolbar button {
      cursor: pointer;
      font-weight: 700;
    }

    .epaper-back {
      text-decoration: none;
      color: #b00020;
      font-weight: 700;
    }

    .epaper-wrap {
      padding: 25px 10px 60px;
      overflow-x: auto;
    }

    .newspaper-page {
      width: 1050px;
      min-height: 1485px;
      margin: auto;
      background: #fff;
      box-shadow: 0 3px 18px rgba(0,0,0,.18);
      padding: 25px;
      box-sizing: border-box;
    }

    .paper-masthead {
      text-align: center;
      border-top: 5px solid #111;
      border-bottom: 3px solid #111;
      padding: 12px 0 8px;
      margin-bottom: 10px;
    }

    .paper-masthead h1 {
      font-family: Georgia, serif;
      font-size: 48px;
      margin: 0;
      letter-spacing: -1px;
    }

    .paper-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-top: 8px;
    }

    .paper-breaking {
      background: #a40000;
      color: #fff;
      text-align: center;
      font-weight: 800;
      padding: 7px;
      margin-bottom: 12px;
    }

    .paper-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    .paper-lead {
      border-right: 1px solid #aaa;
      padding-right: 12px;
    }

    .paper-lead img {
      width: 100%;
      height: 360px;
      object-fit: cover;
    }

    .paper-lead h2 {
      font-family: Georgia, serif;
      font-size: 38px;
      line-height: 1.15;
      margin: 10px 0;
    }

    .paper-story {
      border-bottom: 1px solid #aaa;
      padding: 10px 0;
      cursor: pointer;
    }

    .paper-story img {
      width: 100%;
      height: 145px;
      object-fit: cover;
    }

    .paper-story h3 {
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1.3;
      margin: 6px 0;
    }

    .paper-lower-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      border-top: 3px solid #111;
      margin-top: 14px;
      padding-top: 12px;
    }

    .paper-ad {
      min-height: 120px;
      border: 1px solid #999;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #777;
    }

    .paper-empty {
      padding: 50px;
      text-align: center;
      color: #777;
    }

    @media(max-width:700px) {
      .newspaper-page {
        transform-origin: top left;
      }
    }
  </style>
</head>

<body>

<div class="epaper-toolbar">
  <div class="epaper-toolbar-inner">

    <a href="/" class="epaper-back">
      ← मुख्य वेबसाइट
    </a>

    <strong>📰 VartaPrimeNews ई-पेपर</strong>

    <select id="editionSelect">
      <option value="हरियाणा">हरियाणा संस्करण</option>
      <option value="पानीपत">पानीपत संस्करण</option>
      <option value="रोहतक">रोहतक संस्करण</option>
      <option value="हिसार">हिसार संस्करण</option>
      <option value="गुरुग्राम">गुरुग्राम संस्करण</option>
    </select>

    <input type="date" id="paperDate">

    <button onclick="previousPage()">← पिछला पेज</button>

    <strong id="pageIndicator">
      पेज 1
    </strong>

    <button onclick="nextPage()">अगला पेज →</button>

  </div>
</div>


<div class="epaper-wrap">

  <div class="newspaper-page">

    <header class="paper-masthead">

      <h1>VartaPrimeNews</h1>

      <div class="paper-info">
        <span id="paperEdition">हरियाणा संस्करण</span>
        <span id="paperDateText"></span>
        <span id="paperPageNo">पृष्ठ 1</span>
      </div>

    </header>

    <div class="paper-breaking" id="paperBreaking">
      वार्ताप्राइम न्यूज़ — सत्य • सरोकार • संवाद
    </div>


    <main id="paperContent">

      <div class="paper-empty">
        आज का ई-पेपर तैयार किया जा रहा है...
      </div>

    </main>

  </div>

</div>


<script>

const API_BASE = '/api';

let epaperNews = [];
let currentPage = 1;

function esc(value) {
  const div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

function formatPaperDate() {
  const input = document.getElementById('paperDate');
  const date = input.value
    ? new Date(input.value + 'T00:00:00')
    : new Date();

  return date.toLocaleDateString(
    'hi-IN',
    {
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  );
}


async function loadEPaper() {

  try {

    const res = await fetch(
      `${API_BASE}/news`
    );

    const json = await res.json();

    if (!json.success) {
      throw new Error('News API error');
    }

    epaperNews = json.data || [];

    renderEPaper();

  } catch(err) {

    console.error(err);

    document.getElementById(
      'paperContent'
    ).innerHTML = `
      <div class="paper-empty">
        ई-पेपर समाचार लोड नहीं हो सके।
      </div>
    `;
  }
}


function renderEPaper() {

  const edition =
    document.getElementById(
      'editionSelect'
    ).value;

  document.getElementById(
    'paperEdition'
  ).textContent =
    `${edition} संस्करण`;

  document.getElementById(
    'paperDateText'
  ).textContent =
    formatPaperDate();

  document.getElementById(
    'paperPageNo'
  ).textContent =
    `पृष्ठ ${currentPage}`;

  document.getElementById(
    'pageIndicator'
  ).textContent =
    `पेज ${currentPage}`;

  let news = [...epaperNews];

  if (edition !== 'हरियाणा') {

    const localNews =
      news.filter(n => {

        const text = [
          n.title,
          n.description,
          n.district,
          n.category
        ]
        .filter(Boolean)
        .join(' ');

        return text.includes(edition);

      });

    if (localNews.length >= 5) {
      news = localNews;
    }
  }


  // Page 1 priority:
  // Lead > Breaking > Latest

  news.sort((a,b) => {

    const scoreA =
      (a.isHero ? 100 : 0) +
      (a.isBreaking ? 50 : 0);

    const scoreB =
      (b.isHero ? 100 : 0) +
      (b.isBreaking ? 50 : 0);

    if (scoreB !== scoreA) {
      return scoreB - scoreA;
    }

    return new Date(
      b.approvedAt ||
      b.publishedAt ||
      0
    ) -
    new Date(
      a.approvedAt ||
      a.publishedAt ||
      0
    );

  });


  const perPage = 10;

  const start =
    (currentPage - 1) * perPage;

  const pageNews =
    news.slice(
      start,
      start + perPage
    );


  if (!pageNews.length) {

    document.getElementById(
      'paperContent'
    ).innerHTML = `
      <div class="paper-empty">
        इस पृष्ठ पर समाचार उपलब्ध नहीं हैं।
      </div>
    `;

    return;
  }


  const lead =
    pageNews.find(n => n.isHero) ||
    pageNews[0];

  const others =
    pageNews.filter(
      n => n.id !== lead.id
    );


  const leadImage =
    lead.imageurl
      ? `
        <img
          src="${esc(lead.imageurl)}"
          alt=""
        >
      `
      : '';


  const side =
    others.slice(0,3);


  const lower =
    others.slice(3,9);


  document.getElementById(
    'paperContent'
  ).innerHTML = `

    <section class="paper-grid">

      <article
        class="paper-lead"
        onclick="location.href='/?article=${lead.id}'">

        ${leadImage}

        <h2>
          ${esc(lead.title)}
        </h2>

        <p>
          ${esc(
            lead.description || ''
          )}
        </p>

      </article>


      <div>

        ${side.map(item => `

          <article
            class="paper-story"
            onclick="location.href='/?article=${item.id}'">

            ${
              item.imageurl
              ? `<img src="${esc(item.imageurl)}" alt="">`
              : ''
            }

            <h3>
              ${esc(item.title)}
            </h3>

          </article>

        `).join('')}

      </div>

    </section>


    <div class="paper-ad">
      ADVERTISEMENT
    </div>


    <section class="paper-lower-grid">

      ${lower.map(item => `

        <article
          class="paper-story"
          onclick="location.href='/?article=${item.id}'">

          ${
            item.imageurl
            ? `<img src="${esc(item.imageurl)}" alt="">`
            : ''
          }

          <h3>
            ${esc(item.title)}
          </h3>

          <p>
            ${esc(
              item.description || ''
            )}
          </p>

        </article>

      `).join('')}

    </section>

  `;


  const breaking =
    pageNews.find(
      n => n.isBreaking
    );

  if (breaking) {

    document.getElementById(
      'paperBreaking'
    ).textContent =
      `⚡ ${breaking.title}`;

  }

}


function nextPage() {

  const maxPage =
    Math.max(
      1,
      Math.ceil(
        epaperNews.length / 10
      )
    );

  if (currentPage < maxPage) {
    currentPage++;
    renderEPaper();
    window.scrollTo(0,0);
  }
}


function previousPage() {

  if (currentPage > 1) {
    currentPage--;
    renderEPaper();
    window.scrollTo(0,0);
  }
}


document.getElementById(
  'editionSelect'
).addEventListener(
  'change',
  () => {
    currentPage = 1;
    renderEPaper();
  }
);


document.getElementById(
  'paperDate'
).addEventListener(
  'change',
  () => {
    currentPage = 1;
    renderEPaper();
  }
);


document.getElementById(
  'paperDate'
).value =
  new Date()
    .toISOString()
    .split('T')[0];


loadEPaper();

</script>

</body>
</html>
